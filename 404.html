<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>দাওয়াতুস সুন্নাহ — নতুন ঠিকানা</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://dawatussunnah.github.io/" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #FAF9F5; color: #16241F; padding: 24px;
        font-family: "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif; text-align: center;
      }
      .card { max-width: 420px; }
      h1 { font-size: 22px; margin: 0 0 12px; color: #0B3D2E; }
      p { font-size: 16px; line-height: 1.7; color: #4A5A53; margin: 0 0 24px; }
      a {
        display: inline-block; background: #14805E; color: #fff; text-decoration: none;
        padding: 14px 28px; border-radius: 14px; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>অ্যাপটি নতুন ঠিকানায় চলে গেছে</h1>
      <p>
        এক মুহূর্তের মধ্যেই নতুন ঠিকানায় নিয়ে যাওয়া হচ্ছে। না হলে নিচের বোতামে চাপুন।
        আপনার নম্বর ও পিন দিয়ে প্রবেশ করলে আগের সব আমলের হিসাব আগের মতোই পাবেন।
      </p>
      <a href="https://dawatussunnah.github.io/">নতুন ঠিকানায় যান</a>
    </div>
    <script>
      // This page replaced an installed web app. Clear its service worker and caches first,
      // otherwise the old app keeps being served from the phone and never reaches the new site.
      var NEW_SITE = 'https://dawatussunnah.github.io/';
      function go() { window.location.replace(NEW_SITE); }
      var cleanup = [];
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          cleanup.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          cleanup.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (e) { /* nothing to clean */ }
      // Go anyway if the cleanup stalls, so no one is left staring at this page.
      setTimeout(go, 2500);
      Promise.all(cleanup).then(go, go);
    </script>
  </body>
</html>
